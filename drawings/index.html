<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Every drawing by Teddy, newest first.">
<meta property="og:type" content="website">
<meta property="og:title" content="Teddy's drawings">
<meta property="og:description" content="Every drawing by Teddy, newest first.">
<meta property="og:url" content="https://teddykling.com/">
<meta property="og:image" content="https://teddykling.com/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://teddykling.com/share.png">
<title>Teddy's drawings</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --blue:#1C4FA0; --yellow:#FFCB2E; --orange:#F07B1E; --cream:#FFF4C9; --page:#E9F3FF; --ink:#1C2B4A; --soft:#4A5568; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: "Fredoka", system-ui, sans-serif; font-weight: 500; font-size: 1.2rem; line-height: 1.5; }
  :focus-visible { outline: 4px solid var(--orange); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header { position: relative; background: var(--blue); color: #fff; overflow: hidden; }
  header .wrap { position: relative; z-index: 1; padding-top: 28px; padding-bottom: 90px; }
  .home { color: #CFE0FF; text-decoration: none; font-weight: 600; }
  .home:hover { text-decoration: underline; }
  h1 { font-weight: 600; font-size: clamp(3rem, 12vw, 5.5rem); line-height: .95; margin: 18px 0 0; }
  h1 .dot { color: var(--yellow); }
  .mountains { position: absolute; right: 0; bottom: -1px; width: min(380px, 70vw); height: auto; }
  main.wrap { padding-top: 48px; padding-bottom: 64px; }
  .count { margin: 0 0 24px; color: var(--soft); }
  .grid { display: grid; gap: 28px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .art { margin: 0; }
  .art img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border-radius: 20px; border: 6px solid #fff; box-shadow: 0 14px 24px -16px rgba(28,43,74,.5); }
  .art:nth-child(odd) img { transform: rotate(-1.5deg); }
  .art:nth-child(even) img { transform: rotate(1.2deg); }
  .art figcaption { margin-top: 12px; font-weight: 600; color: var(--blue); }
  .back { display: inline-block; margin-top: 40px; color: var(--blue); font-weight: 600; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  footer { background: var(--blue); color: #CFE0FF; padding: 36px 0 44px; font-size: 1.05rem; }
  footer b { color: #fff; font-weight: 600; } footer .dot { color: var(--yellow); }

  /* Click a drawing to see it bigger */
  .art img { cursor: zoom-in; }
  dialog.zoom { border: 0; padding: 0; background: transparent; max-width: min(92vw, 1100px); max-height: 92vh; overflow: visible; }
  dialog.zoom::backdrop { background: rgba(20, 35, 70, .78); }
  dialog.zoom img { display: block; max-width: min(92vw, 1100px); max-height: 80vh; width: auto; height: auto; border-radius: 20px; border: 8px solid #fff; box-shadow: 0 24px 50px rgba(0,0,0,.45); cursor: zoom-out; }
  dialog.zoom p { margin: 14px 0 0; text-align: center; color: #fff; font-weight: 600; font-size: 1.4rem; }
  dialog.zoom .close { position: absolute; top: -18px; right: -18px; width: 48px; height: 48px; border-radius: 50%; border: 4px solid var(--ink); background: var(--yellow); color: var(--ink); font: 600 1.6rem/1 "Fredoka", sans-serif; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) { dialog.zoom[open] { animation: pop .18s ease-out; } @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } } }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="home" href="../">Teddy's trail</a>
      <h1>My drawings<span class="dot">.</span></h1>
    </div>
    <svg class="mountains" viewBox="0 0 560 220" aria-hidden="true"><path d="M0 220 L170 70 L250 150 L390 20 L560 190 L560 220 Z" fill="#F07B1E"/><path d="M390 20 L358 56 L376 50 L392 64 L408 48 L424 58 Z" fill="#FFF4C9"/></svg>
  </header>
  <main class="wrap">
    <p class="count">Every drawing, newest first.</p>
    <div class="grid">
      <!-- Newest drawing goes at the top of this list -->
      <figure class="art"><img src="drawing-3.jpg" width="1600" height="1194" alt="Down by the Bay, Teddy's crayon drawing of a person in a plaid shirt and straw hat next to a row of watermelons, under a big blue sky with a yellow sun"><figcaption>Down by the Bay</figcaption></figure>
      <figure class="art"><img src="drawing-2.jpg" width="1273" height="1600" alt="BOO, Teddy's crayon drawing of a spooky Halloween night with a vampire, a bat, a ghost, a big blue monster, and a gravestone that says Boo"><figcaption>BOO</figcaption></figure>
      <figure class="art"><img src="drawing-1.jpg" width="1600" height="1200" alt="Scarecrow's Barn, Teddy's crayon drawing of a scarecrow next to a giant orange pumpkin and a barn, with clouds in a blue sky"><figcaption>Scarecrow's Barn</figcaption></figure>
    </div>
    <a class="back" href="../#trail">Back to the trail</a>
  </main>
  <footer><div class="wrap"><b>Teddy<span class="dot">.</span></b> Built by Teddy in partnership with his parents.</div></footer>

  <dialog class="zoom" aria-label="Drawing, larger">
    <button class="close" type="button" aria-label="Close">×</button>
    <img alt="">
    <p></p>
  </dialog>
  <script>
    (function () {
      var d = document.querySelector('dialog.zoom');
      if (!d || !d.showModal) return;
      var big = d.querySelector('img'), cap = d.querySelector('p');
      document.querySelectorAll('.art img').forEach(function (img) {
        img.tabIndex = 0;
        img.setAttribute('role', 'button');
        var open = function () {
          var fc = img.closest('figure').querySelector('figcaption');
          var show = function () {
            big.alt = img.alt;
            cap.textContent = fc ? fc.textContent : '';
            if (!d.open) d.showModal();
          };
          big.onload = null;
          big.removeAttribute('src');
          big.onload = show;
          big.src = img.currentSrc || img.src;
          if (big.complete && big.naturalWidth) { big.onload = null; show(); }
        };
        img.addEventListener('click', open);
        img.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      });
      d.addEventListener('click', function () { d.close(); });
    })();
  </script>
</body>
</html>
