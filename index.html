<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible&display=swap" rel="stylesheet">
<style>
  :root { --page: #F4F6F1; --ink: #1E2B3F; --soft: #4A5568; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; padding: 24px 16px; text-align: center; }
  h1 { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: clamp(4rem, 18vw, 8rem); line-height: .9; margin: 0 0 20px; letter-spacing: -.02em; }
  p { font-size: 1.25rem; color: var(--soft); margin: 0; }
</style>
</head>
<body>
  <main>
    <h1>Teddy</h1>
    <p>Something fun is being built here. Check back soon!</p>
  </main>
</body>
</html>
